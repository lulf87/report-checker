<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTR 标准答案复核</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1db;
  --accent: #2f5fd0; --accent-ink: #ffffff;
  --ok: #1f7a4a; --ok-bg: #e4f3ea; --bad: #b3261e; --bad-bg: #fbe7e5;
  --warn: #8a5a00; --warn-bg: #fdf1d8; --off: #5d5d58; --off-bg: #ecebe6;
  --hl-bad: #ffd9d4; --hl-add: #d7ecff; --focus: #2f5fd0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #34332f;
    --accent: #7ea2ff; --accent-ink: #10131c;
    --ok: #7fd4a3; --ok-bg: #1d3327; --bad: #ff9b91; --bad-bg: #3d1f1c;
    --warn: #f0c46b; --warn-bg: #3a2e14; --off: #b7b6ae; --off-bg: #2c2b28;
    --hl-bad: #5c2a24; --hl-add: #1e3a57; --focus: #7ea2ff;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #34332f;
  --accent: #7ea2ff; --accent-ink: #10131c;
  --ok: #7fd4a3; --ok-bg: #1d3327; --bad: #ff9b91; --bad-bg: #3d1f1c;
  --warn: #f0c46b; --warn-bg: #3a2e14; --off: #b7b6ae; --off-bg: #2c2b28;
  --hl-bad: #5c2a24; --hl-add: #1e3a57; --focus: #7ea2ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 12px 0 6px; }
h1 { font-size: 18px; margin: 0; font-weight: 650; }
.meta { color: var(--muted); font-size: 12px; }
.progress { margin-left: auto; font-size: 13px; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
.bar > i { display: block; height: 100%; background: var(--ok); width: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-bottom: 10px; }
select, input[type=search], input[type=text], button {
  font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
input[type=search] { min-width: 200px; flex: 1 1 200px; }
button { cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border-radius: 999px; padding: 3px 10px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip small { opacity: .7; margin-left: 4px; }
main { padding: 14px 0 80px; }
.notes { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
.notes ul { margin: 4px 0 0; padding-left: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; padding: 12px 14px; }
.card:focus-within, .card.focused { outline: 2px solid var(--focus); outline-offset: 1px; }
.card.done { border-left: 4px solid var(--ok); }
.head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 8px; }
.clause { font-weight: 650; font-size: 15px; }
.badge { display: inline-block; font-size: 12px; border-radius: 4px; padding: 1px 7px; background: var(--off-bg); color: var(--off); }
.d-matched { background: var(--ok-bg); color: var(--ok); }
.d-mismatch { background: var(--bad-bg); color: var(--bad); }
.d-manual { background: var(--warn-bg); color: var(--warn); }
.d-excluded { background: var(--off-bg); color: var(--off); }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
.col h3 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.text { white-space: pre-wrap; word-break: break-word; background: var(--bg); border-radius: 6px; padding: 8px 10px;
  max-height: 340px; overflow: auto; font-size: 13.5px; }
.text mark { background: var(--hl-bad); color: inherit; border-radius: 2px; }
.text mark.add { background: var(--hl-add); }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; }
.shift { margin-top: 8px; font-size: 13px; color: var(--bad); }
table.cells { border-collapse: collapse; margin-top: 8px; font-size: 12.5px; width: 100%; }
table.cells td, table.cells th { border: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; white-space: pre-wrap; }
table.cells th { color: var(--muted); font-weight: 600; }
.claude { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: var(--ok-bg); font-size: 13px; }
.claude.low { background: var(--warn-bg); }
.claude div { margin-top: 3px; }
.verdict { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.verdict .lab { font-size: 12px; color: var(--muted); margin-right: 2px; }
.verdict button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.verdict input[type=text] { flex: 1 1 240px; min-width: 0; }
.verdict .state { font-size: 12.5px; }
.verdict label { font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; }
.more { display: block; margin: 0 auto; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.help { font-size: 12px; color: var(--muted); }
kbd { font-family: ui-monospace, Menlo, monospace; font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>PTR 标准答案复核</h1>
      <span class="meta" id="meta"></span>
      <span class="progress" id="progress"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="controls">
      <select id="view" aria-label="视图">
        <option value="need">需要你看（Claude 不确定 + 抽查）</option>
        <option value="low">Claude 不确定</option>
        <option value="spot">抽查 Claude 有把握的</option>
        <option value="disagree">Claude 认为工具错了</option>
        <option value="all">全部条目</option>
      </select>
      <select id="sample" aria-label="样本"></select>
      <div class="chips" id="risks" role="group" aria-label="风险类别"></div>
      <select id="status" aria-label="复核状态">
        <option value="todo">未复核</option>
        <option value="done">已复核</option>
        <option value="all">全部</option>
      </select>
      <input type="search" id="q" placeholder="搜条款号、原文、原因码">
    </div>
    <div class="controls">
      <button id="bulk" hidden>当前筛选未复核的全部标为“工具正确”…</button>
      <button id="export" class="primary">导出复核结果</button>
      <button id="import">导入</button>
      <input type="file" id="importFile" accept="application/json" hidden>
      <span class="help"><kbd>J</kbd>/<kbd>K</kbd> 上下条 · <kbd>A</kbd> 同意 Claude · <kbd>Y</kbd> 工具正确 · <kbd>1</kbd>–<kbd>4</kbd> 应为 一致/不一致/待确认/排除 · <kbd>U</kbd> 撤销</span>
    </div>
  </div>
</header>
<main class="wrap">
  <div id="notes"></div>
  <div id="list"></div>
  <button class="more" id="more" hidden>显示更多</button>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const DATA = /*__GOLD_DATA__*/null;
const STORE_KEY = "ptr-gold-review/v1";
const DECISIONS = ["matched", "mismatch", "manual", "excluded"];
const L = DATA.labels;
const PAGE = 40;

function loadLocal() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { return {}; }
}
let local = loadLocal();
function saveLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(local)); }
  catch (e) { toast("浏览器不能保存记录，请及时导出"); }
}
const idOf = it => it.sample + "|" + it.key;
function verdictOf(it) {
  const v = local[idOf(it)];
  if (v) return v;
  if (it.gold && it.gold.status === "confirmed") return { ...it.gold, fromGold: true };
  return null;
}

const state = { view: "need", sample: "all", risks: new Set(["A", "B", "C", "D", "E"]), status: "todo", q: "", shown: PAGE, focus: -1 };
const claudeOf = it => (it.gold && it.gold.claude) || null;
let filtered = [];

const $ = id => document.getElementById(id);
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }
function badge(d) { return `<span class="badge d-${esc(d)}">${esc(L[d] || d)}</span>`; }

function segHtml(segs, fallback, cls) {
  if (!segs || !segs.length) return esc(fallback);
  return segs.map(s => s.op === "equal" ? esc(s.text) : `<mark class="${cls}">${esc(s.text)}</mark>`).join("");
}
function fmtNums(list) { return (list || []).map(n => Array.isArray(n) ? n.join("") : n).join("，") || "—"; }

function init() {
  $("meta").textContent = `结果生成于 ${DATA.run.generated_at || "?"}（${DATA.run.git_head || "?"}）`;
  const samples = [...new Set(DATA.items.map(i => i.sample))];
  $("sample").innerHTML = `<option value="all">全部样本</option>` + samples.map(s => `<option value="${s}">${s}</option>`).join("");
  $("risks").innerHTML = Object.entries(DATA.risk_labels).map(([k, v]) =>
    `<button class="chip" data-risk="${k}" aria-pressed="${state.risks.has(k)}" title="${esc(v)}">${k} ${esc(v)}<small data-count="${k}"></small></button>`).join("");
  $("risks").addEventListener("click", e => {
    const b = e.target.closest("[data-risk]"); if (!b) return;
    const k = b.dataset.risk; state.risks.has(k) ? state.risks.delete(k) : state.risks.add(k);
    b.setAttribute("aria-pressed", state.risks.has(k)); reset();
  });
  $("sample").onchange = e => { state.sample = e.target.value; reset(); };
  $("view").onchange = e => { state.view = e.target.value; reset(); };
  $("status").onchange = e => { state.status = e.target.value; reset(); };
  let qt; $("q").oninput = e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); reset(); }, 200); };
  $("more").onclick = () => { state.shown += PAGE; render(); };
  $("export").onclick = exportJson;
  $("import").onclick = () => $("importFile").click();
  $("importFile").onchange = importJson;
  $("bulk").onclick = bulkConfirm;
  $("list").addEventListener("click", onCardClick);
  $("list").addEventListener("change", onCardInput);
  document.addEventListener("keydown", onKey);
  reset();
}

function inView(it) {
  const c = claudeOf(it);
  if (state.view === "low") return !!c && c.confidence === "low";
  if (state.view === "spot") return !!it.spot;
  if (state.view === "need") return (!!c && c.confidence === "low") || !!it.spot;
  if (state.view === "disagree") return !!c && c.expected !== it.decision && !(c.acceptable || []).includes(it.decision);
  return true;
}
function matches(it) {
  if (!inView(it)) return false;
  if (state.sample !== "all" && it.sample !== state.sample) return false;
  if (!state.risks.has(it.risk)) return false;
  const done = !!verdictOf(it);
  if (state.status === "todo" && done) return false;
  if (state.status === "done" && !done) return false;
  if (state.q) {
    const hay = (it.sample + " " + it.clause + " " + it.reason + " " + it.ptr + " " + it.report + " " + it.rules.join(" ")).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}
function reset() { state.shown = PAGE; state.focus = -1; render(); }

function render() {
  filtered = DATA.items.filter(matches);
  const list = $("list");
  const sample = state.sample;
  const notes = sample === "all" ? [] : (DATA.known_issues[sample] || []);
  $("notes").innerHTML = notes.length ? `<div class="notes"><b>${esc(sample)} 已知问题</b><ul>${notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>` : "";
  list.innerHTML = filtered.length ? filtered.slice(0, state.shown).map(cardHtml).join("") : `<div class="empty">当前筛选下没有条目。</div>`;
  $("more").hidden = filtered.length <= state.shown;
  $("more").textContent = `显示更多（还有 ${filtered.length - state.shown} 条）`;
  updateCounts();
}

function updateCounts() {
  const inSample = DATA.items.filter(i => state.sample === "all" || i.sample === state.sample);
  for (const k of Object.keys(DATA.risk_labels)) {
    const all = inSample.filter(i => i.risk === k);
    const done = all.filter(i => verdictOf(i)).length;
    const el = document.querySelector(`[data-count="${k}"]`);
    if (el) el.textContent = `${done}/${all.length}`;
  }
  const total = DATA.items.length, done = DATA.items.filter(i => verdictOf(i)).length;
  const priority = DATA.items.filter(i => { const c = claudeOf(i); return (c && c.confidence === "low") || i.spot; });
  const pDone = priority.filter(i => verdictOf(i)).length;
  $("progress").textContent = `需要你看 ${pDone}/${priority.length} · 全部已人工确认 ${done}/${total}`;
  $("bar").style.width = (priority.length ? 100 * pDone / priority.length : 0) + "%";
  $("bulk").hidden = state.view !== "all";
  $("bulk").textContent = `当前筛选未复核的 ${filtered.filter(i => !verdictOf(i)).length} 条全部标为“工具正确”…`;
}

function cardHtml(it, index) {
  const v = verdictOf(it);
  const pages = Object.entries(it.pages || {}).map(([r, p]) => `${r === "ptr" ? "PTR" : "报告"} 第${p.join("、")}页`).join(" · ");
  const facts = [];
  if (it.rules.length) facts.push(`<span>等价规则 <b>${esc(it.rules.join("、"))}</b></span>`);
  if (it.numeric && (it.numeric.ptr?.length || it.numeric.report?.length))
    facts.push(`<span>数值 ${badge(it.numeric.status)} PTR <b>${esc(fmtNums(it.numeric.ptr))}</b> ｜ 报告 <b>${esc(fmtNums(it.numeric.report))}</b></span>`);
  if (it.unit && (it.unit.ptr?.length || it.unit.report?.length || it.unit.status === "mismatch"))
    facts.push(`<span>单位 ${badge(it.unit.status)} PTR <b>${esc((it.unit.ptr || []).join("、") || "—")}</b> ｜ 报告 <b>${esc((it.unit.report || []).join("、") || "—")}</b> <span class="code">${esc(it.unit.reason_code || "")}</span></span>`);
  const ref = it.reference || {};
  const refStr = r => r ? [...(r.standards || []), ...(r.tables || [])].join("、") : "";
  if (refStr(ref.ptr) || refStr(ref.report) || ref.status === "mismatch")
    facts.push(`<span>引用 ${badge(ref.status)} PTR <b>${esc(refStr(ref.ptr) || "—")}</b> ｜ 报告 <b>${esc(refStr(ref.report) || "—")}</b></span>`);
  if (it.table && it.table.reason_code) facts.push(`<span>表格 ${badge(it.table.status)} <span class="code">${esc(it.table.reason_code)}</span></span>`);
  if (it.scope && it.decision === "excluded") facts.push(`<span>范围 <span class="code">${esc(it.scope)}</span></span>`);
  if (it.mapping && it.mapping.report_clause_ids?.length && it.mapping.report_clause_ids.join() !== it.clause)
    facts.push(`<span>报告条款 <b>${esc(it.mapping.report_clause_ids.join("、"))}</b></span>`);
  const cells = it.cells.length ? `<table class="cells"><tr><th>行/列</th><th>PTR</th><th>报告</th><th>结果</th></tr>${it.cells.map(c =>
    `<tr><td>${esc(c.column)}</td><td>${esc(c.ptr)}</td><td>${esc(c.report)}</td><td>${badge(c.status === "matched" ? "matched" : c.status === "mismatch" ? "mismatch" : "manual")} <span class="code">${esc(c.reason_code)}</span></td></tr>`).join("")}</table>` : "";
  const exp = v ? v.expected : null;
  const c = claudeOf(it);
  const claudeHtml = c ? `<div class="claude${c.confidence === "low" ? " low" : ""}">
      <b>Claude 判断：应为 ${badge(c.expected)}</b>${c.expected === it.decision ? "（工具正确）" : (c.acceptable || []).includes(it.decision) ? "（工具结果可接受）" : "（工具错误）"}
      · 把握：<b>${c.confidence === "low" ? "不确定，需要你定" : "有把握"}</b>${it.spot ? " · <b>抽查样本</b>" : ""}
      <div>${esc(c.reason)}</div>${c.issue ? `<div>问题：${esc(c.issue)}</div>` : ""}
    </div>` : "";
  const btn = (d, key) => `<button data-act="set" data-d="${d}" aria-pressed="${exp === d}" title="快捷键 ${key}">应为${L[d]}</button>`;
  const stateText = v
    ? `<span class="state">${v.fromGold ? "答案文件中已确认" : "已复核"}：应为 ${badge(v.expected)}${v.expected === it.decision ? "（工具正确）" : "（工具错误）"}</span>`
    : `<span class="state help">未复核</span>`;
  const accept = v && v.expected !== "manual"
    ? `<label><input type="checkbox" data-act="acceptable" ${v.acceptable?.includes("manual") ? "checked" : ""}> 判待确认也可接受</label>` : "";
  const issue = v && v.expected === "mismatch"
    ? `<input type="text" data-act="issue" placeholder="具体问题（如：单位 MΩ ↔ GΩ）" value="${esc(v.issue || "")}">` : "";
  const note = v ? `<input type="text" data-act="note" placeholder="备注（可选）" value="${esc(v.note || "")}">` : "";
  return `<article class="card${v ? " done" : ""}${index === state.focus ? " focused" : ""}" data-id="${esc(idOf(it))}" data-index="${index}">
    <div class="head">
      <span class="clause">${esc(it.sample)} · ${esc(it.clause)}</span>
      <span class="badge" title="${esc(DATA.risk_labels[it.risk])}">${esc(it.risk)}</span>
      工具：${badge(it.decision)} <span class="code">${esc(it.reason || "")}</span>
      <span class="meta">${esc(pages)}</span>
    </div>
    <div class="cols">
      <div class="col"><h3>PTR</h3><div class="text">${segHtml(it.ptr_seg, it.ptr, "add")}</div>
        <details><summary>原文（保留换行）</summary><div class="text">${esc(it.ptr)}</div></details></div>
      <div class="col"><h3>报告</h3><div class="text">${segHtml(it.report_seg, it.report, "")}</div>
        <details><summary>原文（保留换行）</summary><div class="text">${esc(it.report)}</div></details></div>
    </div>
    ${it.shift ? `<div class="shift">${esc(it.shift)}</div>` : ""}
    ${facts.length ? `<div class="facts">${facts.join("")}</div>` : ""}
    ${cells}
    ${claudeHtml}
    <div class="verdict">
      ${c ? `<button data-act="agree" class="primary" title="快捷键 A" aria-pressed="${!!v && exp === c.expected}">同意 Claude（${esc(L[c.expected])}）</button>` : ""}
      <button data-act="ok" title="快捷键 Y" aria-pressed="${!!v && exp === it.decision}">工具正确（${esc(L[it.decision])}）</button>
      <span class="lab">或</span>${btn("matched", 1)}${btn("mismatch", 2)}${btn("manual", 3)}${btn("excluded", 4)}
      ${v && !v.fromGold ? `<button data-act="undo" title="快捷键 U">撤销</button>` : ""}
      ${stateText}${accept}${issue}${note}
    </div>
  </article>`;
}

function itemById(id) { return DATA.items.find(i => idOf(i) === id); }
function setVerdict(it, expected) {
  const c = claudeOf(it);
  const prev = verdictOf(it) || (c && c.expected === expected ? { acceptable: c.acceptable, issue: c.issue } : {});
  local[idOf(it)] = {
    expected,
    acceptable: (prev.acceptable || []).filter(d => d !== expected),
    issue: expected === "mismatch" ? (prev.issue || "") : "",
    note: prev.note || "",
    reviewed_at: new Date().toISOString().slice(0, 10),
  };
  saveLocal();
}
function rerenderCard(it) {
  const idx = filtered.indexOf(it);
  const old = document.querySelector(`[data-id="${CSS.escape(idOf(it))}"]`);
  if (!old) return;
  const tmp = document.createElement("div"); tmp.innerHTML = cardHtml(it, idx);
  old.replaceWith(tmp.firstElementChild);
  updateCounts();
}
function onCardClick(e) {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const card = b.closest(".card"); const it = itemById(card.dataset.id);
  state.focus = Number(card.dataset.index);
  if (b.dataset.act === "agree") setVerdict(it, claudeOf(it).expected);
  else if (b.dataset.act === "ok") setVerdict(it, it.decision);
  else if (b.dataset.act === "set") setVerdict(it, b.dataset.d);
  else if (b.dataset.act === "undo") { delete local[idOf(it)]; saveLocal(); }
  rerenderCard(it);
  if (b.dataset.act === "set" && b.dataset.d === "mismatch") {
    const input = document.querySelector(`[data-id="${CSS.escape(idOf(it))}"] [data-act="issue"]`); if (input) input.focus();
  }
}
function onCardInput(e) {
  const el = e.target; const act = el.dataset.act; if (!act) return;
  const card = el.closest(".card"); const it = itemById(card.dataset.id);
  const v = verdictOf(it); if (!v) return;
  const cur = local[idOf(it)] || { expected: v.expected, acceptable: v.acceptable || [], issue: v.issue || "", note: v.note || "", reviewed_at: v.reviewed_at };
  if (act === "issue") cur.issue = el.value;
  if (act === "note") cur.note = el.value;
  if (act === "acceptable") cur.acceptable = el.checked ? ["manual"] : [];
  local[idOf(it)] = cur; saveLocal();
}
function onKey(e) {
  if ((e.target instanceof Element && e.target.matches("input, select, textarea")) || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const visible = filtered.slice(0, state.shown);
  if (k === "j" || k === "k") {
    if (!visible.length) return;
    state.focus = Math.max(0, Math.min(visible.length - 1, state.focus + (k === "j" ? 1 : -1)));
    document.querySelectorAll(".card.focused").forEach(c => c.classList.remove("focused"));
    const card = document.querySelector(`.card[data-index="${state.focus}"]`);
    if (card) { card.classList.add("focused"); card.scrollIntoView({ block: "start", behavior: "smooth" }); window.scrollBy(0, -150); }
    e.preventDefault(); return;
  }
  const it = visible[state.focus]; if (!it) return;
  if (k === "a" && claudeOf(it)) setVerdict(it, claudeOf(it).expected);
  else if (k === "y") setVerdict(it, it.decision);
  else if ("1234".includes(k) && k.length === 1) setVerdict(it, DECISIONS[Number(k) - 1]);
  else if (k === "u") { delete local[idOf(it)]; saveLocal(); }
  else return;
  e.preventDefault(); rerenderCard(it);
}
function bulkConfirm() {
  const todo = filtered.filter(i => !verdictOf(i));
  if (!todo.length) { toast("当前筛选没有未复核条目"); return; }
  const byRisk = {}; todo.forEach(i => byRisk[i.risk] = (byRisk[i.risk] || 0) + 1);
  const desc = Object.entries(byRisk).map(([k, n]) => `${k} 类 ${n} 条`).join("、");
  if (!confirm(`把当前筛选中未复核的 ${todo.length} 条（${desc}）全部标为“工具正确”？\n只建议在抽查过后，对 D（原文相同）和 E（排除）使用。`)) return;
  todo.forEach(i => setVerdict(i, i.decision));
  render(); toast(`已标记 ${todo.length} 条`);
}
function exportJson() {
  const verdicts = DATA.items.filter(i => local[idOf(i)]).map(i => ({ sample: i.sample, key: i.key, clause_id: i.clause, tool_decision: i.decision, ...local[idOf(i)] }));
  if (!verdicts.length) { toast("还没有本机复核记录"); return; }
  const out = { schema: "ptr-gold-review-export/1", exported_at: new Date().toISOString(), run: DATA.run, verdicts };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ptr-gold-review-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`已导出 ${verdicts.length} 条`);
}
function importJson(e) {
  const file = e.target.files[0]; if (!file) return;
  file.text().then(text => {
    const data = JSON.parse(text); let n = 0;
    for (const v of data.verdicts || []) {
      if (!DECISIONS.includes(v.expected)) continue;
      local[v.sample + "|" + v.key] = { expected: v.expected, acceptable: v.acceptable || [], issue: v.issue || "", note: v.note || "", reviewed_at: v.reviewed_at };
      n++;
    }
    saveLocal(); render(); toast(`已导入 ${n} 条`);
  }).catch(() => toast("文件读不出来")).finally(() => { e.target.value = ""; });
}
init();
</script>
