[project]
name = "report-checker-mvp"
version = "1.2.1"
description = "Local deterministic PDF report checker: Report self-check and Report + GB 9706.1 / 9706.202 Record comparison"
requires-python = ">=3.12"
dependencies = [
  "PyMuPDF>=1.26,<2",
  "Pillow>=12,<13",
  "ocrmac>=1,<2; sys_platform == 'darwin'",
  "rapidocr-onnxruntime>=1.4,<2",
]

[tool.uv]
package = false
